{% extends 'students/base.html' %}

{% block title %}Sign In - Student Management System{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card bg-white shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-4">
                <i class="bi bi-mortarboard-fill fs-1 text-warning mb-2 d-inline-block"></i>
                <h4 class="fw-bold mb-1">StudentMS Portal</h4>
                <p class="small mb-0 opacity-75">Sign in to access your tailored dashboard</p>
            </div>

            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">
                            <i class="bi bi-person me-1"></i> Username
                        </label>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-semibold">
                            <i class="bi bi-key me-1"></i> Password
                        </label>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <!-- Demo Credentials Quick Selector -->
                <div class="mt-4 pt-3 border-top">
                    <p class="small text-muted fw-bold text-uppercase mb-2 text-center">
                        <i class="bi bi-stars text-warning me-1"></i> Quick Demo Logins (Click to autofill)
                    </p>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-primary btn-sm text-start d-flex justify-content-between align-items-center" onclick="autofill('admin', 'admin123')">
                            <span><i class="bi bi-shield-lock-fill me-1 text-danger"></i> <strong>Admin:</strong> full CRUD, CSV import, analytics</span>
                            <span class="badge bg-primary">Autofill</span>
                        </button>
                        <button type="button" class="btn btn-outline-success btn-sm text-start d-flex justify-content-between align-items-center" onclick="autofill('teacher', 'teacher123')">
                            <span><i class="bi bi-journal-check me-1 text-success"></i> <strong>Teacher:</strong> marks &amp; attendance entry</span>
                            <span class="badge bg-success">Autofill</span>
                        </button>
                        <button type="button" class="btn btn-outline-info btn-sm text-start d-flex justify-content-between align-items-center" onclick="autofill('student', 'student123')">
                            <span><i class="bi bi-person-badge me-1 text-info"></i> <strong>Student:</strong> profile, grades &amp; PDF transcript</span>
                            <span class="badge bg-info text-dark">Autofill</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function autofill(username, password) {
    document.getElementById('id_username').value = username;
    document.getElementById('id_password').value = password;
}
</script>
{% endblock %}
